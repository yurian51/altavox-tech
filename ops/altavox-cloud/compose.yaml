name: altavox-cloud

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: altavox
      POSTGRES_USER: altavox
      POSTGRES_PASSWORD: ${ALTAVOX_DB_PASSWORD:?Set ALTAVOX_DB_PASSWORD in the server environment}
    volumes:
      - altavox_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altavox -d altavox"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [control_plane]
    security_opt:
      - no-new-privileges:true

  control-plane:
    build:
      context: ./control-plane
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATABASE_URL: postgresql://altavox:${ALTAVOX_DB_PASSWORD}@database:5432/altavox
      ALTAVOX_CONTROL_PLANE_TOKEN: ${ALTAVOX_CONTROL_PLANE_TOKEN:?Set ALTAVOX_CONTROL_PLANE_TOKEN in the server environment}
      DB_POOL_MAX: "10"
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [control_plane]
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  altavox_db:

networks:
  control_plane:
    internal: true
