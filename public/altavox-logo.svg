<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07294d" />
      <stop offset="100%" stop-color="#0a3d70" />
    </linearGradient>
    <linearGradient id="gradOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f26522" />
      <stop offset="100%" stop-color="#ff7b39" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon Background Badge -->
  <rect x="5" y="10" width="90" height="90" rx="20" fill="url(#gradBrand)" />
  <rect x="5" y="10" width="90" height="90" rx="20" fill="none" stroke="#f26522" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Capricorn / Ibex Horns Geometric Icon -->
  <g transform="translate(14, 18) scale(0.9)">
    <!-- Left Horn -->
    <path d="M 22 62 C 16 48, 14 30, 24 16 C 30 7, 40 4, 46 8 C 42 16, 36 26, 36 40 C 36 50, 40 56, 42 62 Z" fill="#ffffff" />
    <!-- Right Horn -->
    <path d="M 66 62 C 72 48, 74 30, 64 16 C 58 7, 48 4, 42 8 C 46 16, 52 26, 52 40 C 52 50, 48 56, 46 62 Z" fill="#ffffff" />
    <!-- Crown / Central Node -->
    <polygon points="44,22 40,32 48,32" fill="url(#gradOrange)" />
    <!-- Facial Ridge -->
    <path d="M 38 48 L 44 40 L 50 48 L 44 68 Z" fill="url(#gradOrange)" />
    <!-- Lower Shield Accent -->
    <circle cx="44" cy="74" r="3.5" fill="#ffffff" />
  </g>

  <!-- Text: ALTAVOX -->
  <text x="112" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#07294d" letter-spacing="-0.03em">
    ALTAVOX
  </text>

  <!-- Text: TECH -->
  <text x="312" y="60" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#f26522" letter-spacing="-0.03em">
    TECH
  </text>

  <!-- Subtitle Tagline -->
  <text x="114" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#5a6b82" letter-spacing="0.2em">
    SYSTEMS &amp; IT PLATFORMS
  </text>
</svg>
